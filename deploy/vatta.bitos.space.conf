# nginx config for http://vatta.bitos.space
# Install at /etc/nginx/sites-available/vatta.bitos.space
# then: ln -s /etc/nginx/sites-available/vatta.bitos.space /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name vatta.bitos.space;

    root /var/www/vatta.bitos.space;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
